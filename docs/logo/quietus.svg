<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Quietus</title>
  <rect width="64" height="64" rx="14" fill="#1d428a"/>
  <!-- Monogramme Q blanc (chasse et proportions alignees sur Kikan) -->
  <circle cx="28" cy="28" r="15" fill="none" stroke="#fff" stroke-width="7.5"/>
  <path d="M35 35 L45 45" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Onde de telemetrie au coeur du Q mise au silence -->
  <rect x="21" y="24" width="3.2" height="8" rx="1.6" fill="#d2aa3c"/>
  <rect x="26" y="20" width="3.2" height="16" rx="1.6" fill="#d2aa3c"/>
  <line x1="31.5" y1="28" x2="36.5" y2="28" stroke="#50b450" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Medaillon d'angle Kikan (#d86018) avec coche blanche -->
  <circle cx="46" cy="46" r="13" fill="#1d428a"/>
  <circle cx="46" cy="46" r="10.5" fill="#d86018"/>
  <path d="M41.2 46.4 L44.8 49.8 L51.2 43" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
